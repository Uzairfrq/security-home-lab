networks:
  labnet:
    external: true

services:
  juice-shop:
    image: bkimminich/juice-shop:v16.0.0
    container_name: lab-juice-shop
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - labnet
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
          pids: 100
    restart: unless-stopped

  whoami-target:
    image: traefik/whoami:v1.10.0
    container_name: lab-whoami-target
    ports:
      - "127.0.0.1:8081:80"
    networks:
      - labnet
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
          pids: 100
    restart: unless-stopped
